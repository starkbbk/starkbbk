<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" style="stop-color:#0a001a"/>
      <stop offset="40%" style="stop-color:#0d0028"/>
      <stop offset="70%" style="stop-color:#1a0033"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    <radialGradient id="nebula1">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="nebula2">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="explosion">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ff6600;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="laser-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ██ DEEP SPACE BACKGROUND ██ -->
  <rect width="1000" height="250" fill="url(#bg)"/>
  
  <!-- Nebula Clouds -->
  <ellipse cx="200" cy="120" rx="250" ry="120" fill="url(#nebula1)"/>
  <ellipse cx="800" cy="100" rx="200" ry="100" fill="url(#nebula2)"/>
  <ellipse cx="500" cy="200" rx="300" ry="80" fill="url(#nebula1)" opacity="0.5"/>

  <!-- ═══════════ ⭐ HYPER SPEED STARS ═══════════ -->
  
  <!-- Layer 1: Fast streaking stars (left to right) -->
  <line x1="0" y1="30" x2="30" y2="30" stroke="white" stroke-width="1.5" opacity="0.8">
    <animate attributeName="x1" values="-50;1050" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-20;1080" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="90" x2="25" y2="90" stroke="#00ffff" stroke-width="1" opacity="0.6">
    <animate attributeName="x1" values="-50;1050" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="x2" values="-25;1075" dur="1s" repeatCount="indefinite" begin="0.3s"/>
  </line>
  <line x1="0" y1="160" x2="35" y2="160" stroke="white" stroke-width="1" opacity="0.7">
    <animate attributeName="x1" values="-50;1050" dur="0.7s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="x2" values="-15;1085" dur="0.7s" repeatCount="indefinite" begin="0.1s"/>
  </line>
  <line x1="0" y1="210" x2="20" y2="210" stroke="#ff00ff" stroke-width="1" opacity="0.5">
    <animate attributeName="x1" values="-50;1050" dur="0.9s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="x2" values="-30;1070" dur="0.9s" repeatCount="indefinite" begin="0.5s"/>
  </line>
  <line x1="0" y1="55" x2="40" y2="55" stroke="white" stroke-width="1.5" opacity="0.9">
    <animate attributeName="x1" values="-50;1050" dur="0.6s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="x2" values="-10;1090" dur="0.6s" repeatCount="indefinite" begin="0.2s"/>
  </line>
  <line x1="0" y1="130" x2="28" y2="130" stroke="#00ffff" stroke-width="1" opacity="0.6">
    <animate attributeName="x1" values="-50;1050" dur="1.1s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="x2" values="-22;1078" dur="1.1s" repeatCount="indefinite" begin="0.4s"/>
  </line>
  <line x1="0" y1="195" x2="22" y2="195" stroke="white" stroke-width="1" opacity="0.5">
    <animate attributeName="x1" values="-50;1050" dur="0.85s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="x2" values="-28;1072" dur="0.85s" repeatCount="indefinite" begin="0.6s"/>
  </line>
  <line x1="0" y1="15" x2="32" y2="15" stroke="white" stroke-width="1" opacity="0.7">
    <animate attributeName="x1" values="-50;1050" dur="0.75s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="x2" values="-18;1082" dur="0.75s" repeatCount="indefinite" begin="0.15s"/>
  </line>
  <line x1="0" y1="240" x2="25" y2="240" stroke="#ff00ff" stroke-width="1" opacity="0.4">
    <animate attributeName="x1" values="-50;1050" dur="0.95s" repeatCount="indefinite" begin="0.7s"/>
    <animate attributeName="x2" values="-25;1075" dur="0.95s" repeatCount="indefinite" begin="0.7s"/>
  </line>
  <line x1="0" y1="75" x2="30" y2="75" stroke="white" stroke-width="1.5" opacity="0.8">
    <animate attributeName="x1" values="-50;1050" dur="0.65s" repeatCount="indefinite" begin="0.35s"/>
    <animate attributeName="x2" values="-20;1080" dur="0.65s" repeatCount="indefinite" begin="0.35s"/>
  </line>

  <!-- Twinkling Stars (background) -->
  <circle cx="100" cy="40" r="1" fill="white"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="200" r="1.5" fill="#00ffff"><animate attributeName="opacity" values="0.1;1;0.1" dur="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="30" r="1" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="220" r="1" fill="#ff00ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="750" cy="40" r="1.5" fill="white"><animate attributeName="opacity" values="0.1;1;0.1" dur="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="200" r="1" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="50" cy="180" r="1" fill="#00ffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="150" r="1" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.45s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="60" r="1.5" fill="#ff00ff"><animate attributeName="opacity" values="0.1;1;0.1" dur="0.55s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="150" r="1" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="0.35s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="110" r="1" fill="white"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.65s" repeatCount="indefinite"/></circle>
  <circle cx="550" cy="190" r="1" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="970" cy="90" r="1" fill="#00ffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="30" cy="70" r="1" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="0.5s" repeatCount="indefinite"/></circle>

  <!-- ═══════════ 🚀 SPACESHIP 1 (LEFT - Cyan) ═══════════ -->
  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;10,-5;0,0;-10,5;0,0" dur="2s" repeatCount="indefinite"/>
      <!-- Body -->
      <polygon points="130,80 180,70 180,90" fill="#00ffff" opacity="0.9"/>
      <!-- Wing Top -->
      <polygon points="140,80 155,60 160,75" fill="#0088aa" opacity="0.8"/>
      <!-- Wing Bottom -->
      <polygon points="140,80 155,100 160,85" fill="#0088aa" opacity="0.8"/>
      <!-- Cockpit -->
      <circle cx="170" cy="80" r="4" fill="#00ffff" opacity="0.6"/>
      <!-- Engine Glow -->
      <ellipse cx="128" cy="80" rx="8" ry="3" fill="#00ffff" opacity="0.5">
        <animate attributeName="rx" values="8;12;8" dur="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="122" cy="80" rx="5" ry="2" fill="#ffffff" opacity="0.3">
        <animate attributeName="rx" values="5;8;5" dur="0.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- 🚀 SPACESHIP 2 (LEFT - Small Cyan Ally) -->
  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;8,8;0,0;-8,-3;0,0" dur="2.5s" repeatCount="indefinite"/>
      <polygon points="110,140 150,133 150,147" fill="#00ccff" opacity="0.8"/>
      <polygon points="118,140 130,125 135,137" fill="#006688" opacity="0.7"/>
      <polygon points="118,140 130,155 135,143" fill="#006688" opacity="0.7"/>
      <ellipse cx="108" cy="140" rx="6" ry="2" fill="#00ffff" opacity="0.5">
        <animate attributeName="rx" values="6;10;6" dur="0.25s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- ═══════════ 👾 SPACESHIP 3 (RIGHT - Red Enemy) ═══════════ -->
  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-10,-5;0,0;10,5;0,0" dur="2.2s" repeatCount="indefinite"/>
      <!-- Body (facing left) -->
      <polygon points="870,85 820,75 820,95" fill="#ff0044" opacity="0.9"/>
      <!-- Wing Top -->
      <polygon points="860,85 845,65 840,80" fill="#aa0022" opacity="0.8"/>
      <!-- Wing Bottom -->
      <polygon points="860,85 845,105 840,90" fill="#aa0022" opacity="0.8"/>
      <!-- Cockpit -->
      <circle cx="830" cy="85" r="4" fill="#ff0044" opacity="0.6"/>
      <!-- Engine Glow -->
      <ellipse cx="873" cy="85" rx="8" ry="3" fill="#ff0044" opacity="0.5">
        <animate attributeName="rx" values="8;12;8" dur="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="878" cy="85" rx="5" ry="2" fill="#ffaa00" opacity="0.3">
        <animate attributeName="rx" values="5;8;5" dur="0.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- 👾 SPACESHIP 4 (RIGHT - Small Red Enemy) -->
  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-8,6;0,0;8,-4;0,0" dur="2.3s" repeatCount="indefinite"/>
      <polygon points="890,150 850,143 850,157" fill="#ff3366" opacity="0.8"/>
      <polygon points="882,150 870,135 865,148" fill="#990033" opacity="0.7"/>
      <polygon points="882,150 870,165 865,152" fill="#990033" opacity="0.7"/>
      <ellipse cx="893" cy="150" rx="6" ry="2" fill="#ff0044" opacity="0.5">
        <animate attributeName="rx" values="6;10;6" dur="0.25s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- ═══════════ 💥 LASER BEAMS — CYAN SHOOTING RIGHT ═══════════ -->
  
  <!-- Laser 1: Main ship → Enemy -->
  <line x1="0" y1="80" x2="40" y2="80" stroke="#00ffff" stroke-width="2" filter="url(#laser-glow)" opacity="0">
    <animate attributeName="x1" values="180;850" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="220;890" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="0.4s" repeatCount="indefinite"/>
  </line>

  <!-- Laser 2: Main ship upper -->
  <line x1="0" y1="75" x2="35" y2="72" stroke="#00ffff" stroke-width="1.5" filter="url(#laser-glow)" opacity="0">
    <animate attributeName="x1" values="175;840" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="x2" values="210;875" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
  </line>

  <!-- Laser 3: Small cyan ship -->
  <line x1="0" y1="140" x2="35" y2="138" stroke="#00ccff" stroke-width="1.5" filter="url(#laser-glow)" opacity="0">
    <animate attributeName="x1" values="150;860" dur="0.45s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="x2" values="185;895" dur="0.45s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="0.45s" repeatCount="indefinite" begin="0.1s"/>
  </line>

  <!-- ═══════════ 💥 LASER BEAMS — RED SHOOTING LEFT ═══════════ -->
  
  <!-- Red Laser 1: Enemy → Main ship -->
  <line x1="0" y1="85" x2="40" y2="85" stroke="#ff0044" stroke-width="2" filter="url(#laser-glow)" opacity="0">
    <animate attributeName="x1" values="820;150" dur="0.35s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="x2" values="780;110" dur="0.35s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="0.35s" repeatCount="indefinite" begin="0.15s"/>
  </line>

  <!-- Red Laser 2: Enemy upper -->
  <line x1="0" y1="80" x2="30" y2="78" stroke="#ff3366" stroke-width="1.5" filter="url(#laser-glow)" opacity="0">
    <animate attributeName="x1" values="825;160" dur="0.55s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="x2" values="795;130" dur="0.55s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="0.55s" repeatCount="indefinite" begin="0.3s"/>
  </line>

  <!-- Red Laser 3: Small enemy ship -->
  <line x1="0" y1="150" x2="35" y2="148" stroke="#ff0044" stroke-width="1.5" filter="url(#laser-glow)" opacity="0">
    <animate attributeName="x1" values="850;130" dur="0.42s" repeatCount="indefinite" begin="0.25s"/>
    <animate attributeName="x2" values="815;95" dur="0.42s" repeatCount="indefinite" begin="0.25s"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="0.42s" repeatCount="indefinite" begin="0.25s"/>
  </line>

  <!-- ═══════════ 💥 EXPLOSIONS ═══════════ -->
  
  <!-- Explosion 1 (center battle zone) -->
  <circle cx="500" cy="85" r="0" fill="url(#explosion)" opacity="0">
    <animate attributeName="r" values="0;15;0" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Explosion 2 -->
  <circle cx="520" cy="100" r="0" fill="url(#explosion)" opacity="0">
    <animate attributeName="r" values="0;10;0" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- Explosion 3 -->
  <circle cx="480" cy="70" r="0" fill="url(#explosion)" opacity="0">
    <animate attributeName="r" values="0;12;0" dur="1.8s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="1.8s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- Explosion sparks -->
  <circle cx="510" cy="90" r="1" fill="#ffff00" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="cx" values="510;490" dur="0.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="495" cy="80" r="1" fill="#ff6600" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.6s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="cy" values="80;65" dur="0.6s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="505" cy="95" r="1" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.7s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="cx" values="505;520" dur="0.7s" repeatCount="indefinite" begin="0.1s"/>
  </circle>

  <!-- ═══════════ 🪐 PLANETS ═══════════ -->
  
  <!-- Planet 1 (Purple with ring) -->
  <circle cx="60" cy="45" r="12" fill="#6a0dad" opacity="0.5">
    <animate attributeName="cy" values="45;50;45" dur="4s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="60" cy="45" rx="20" ry="4" fill="none" stroke="#9b59b6" stroke-width="1.5" opacity="0.4" transform="rotate(-15,60,45)">
    <animate attributeName="cy" values="45;50;45" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Planet 2 (Orange) -->
  <circle cx="940" cy="210" r="10" fill="#ff6600" opacity="0.4">
    <animate attributeName="cx" values="940;935;940" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Planet 3 (tiny cyan) -->
  <circle cx="960" cy="30" r="5" fill="#00bcd4" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══════════ ☄️ FAST SHOOTING STARS ═══════════ -->
  <line x1="0" y1="0" x2="80" y2="20" stroke="white" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="0.6s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="x1" values="300;600" dur="0.6s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="y1" values="10;40" dur="0.6s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="x2" values="380;680" dur="0.6s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="y2" values="30;60" dur="0.6s" repeatCount="indefinite" begin="0s"/>
  </line>
  <line x1="0" y1="0" x2="60" y2="15" stroke="#00ffff" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="0.8s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="x1" values="700;400" dur="0.8s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="y1" values="180;210" dur="0.8s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="x2" values="640;340" dur="0.8s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="y2" values="195;225" dur="0.8s" repeatCount="indefinite" begin="1s"/>
  </line>

  <!-- ═══════════ TEXT ═══════════ -->
  
  <!-- Text Shadow/Glow -->
  <text x="500" y="115" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="bold" fill="#00ffff" filter="url(#glow)" opacity="0.3">
    Hey I'm Shivanand 👋
  </text>
  
  <!-- Main Text -->
  <text x="500" y="115" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="bold" fill="#00ffff" filter="url(#glow)">
    Hey I'm Shivanand 👋
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="155" text-anchor="middle" font-family="'Fira Code', monospace" font-size="18" fill="#ff00ff" filter="url(#glow)">
    Full Stack Developer | Backend Engineer | Problem Solver
  </text>

  <!-- Bottom fade -->
  <rect y="220" width="1000" height="30" fill="url(#bg)" opacity="0.5"/>
  <path d="M0,235 Q250,215 500,235 T1000,235 L1000,250 L0,250 Z" fill="#0D1117" opacity="0.9"/>
</svg>
