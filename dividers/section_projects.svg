<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="nb" cx="50%" cy="50%"><stop offset="0%" stop-color="rgba(255,0,100,0.12)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
  </defs>
  <rect width="1200" height="80" fill="#020010"/>
  <ellipse cx="600" cy="40" rx="480" ry="50" fill="url(#nb)" opacity="0.6"/>
  <g fill="white">
    <circle cx="45" cy="18" r="0.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="62" r="0.6"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="25" r="0.4"><animate attributeName="opacity" values="0.6;0.05;0.6" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="55" r="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="12" r="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="68" r="0.6"><animate attributeName="opacity" values="0.8;0.05;0.8" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="20" r="0.4"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="58" r="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="35" r="0.5"><animate attributeName="opacity" values="0.5;0.05;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="100" cy="40" r="1.4" fill="#FF69B4" filter="url(#gl)"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="30" r="1.2" fill="#00FFFF" filter="url(#gl)"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
  <line x1="50" y1="40" x2="370" y2="40" stroke="#00FF88" stroke-width="0.5" opacity="0.2"/>
  <line x1="830" y1="40" x2="1150" y2="40" stroke="#00FF88" stroke-width="0.5" opacity="0.2"/>
  <!-- Rocket flying -->
  <g>
    <polygon points="0,35 -7,32 -9,35 -7,38" fill="#FFD700" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="-15,0;1220,0" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <ellipse cx="-13" cy="35" rx="5" ry="1" fill="#FF6600" opacity="0.2">
      <animateTransform attributeName="transform" type="translate" values="-15,0;1220,0" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <text x="600" y="48" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" filter="url(#gl)" letter-spacing="4">🚀 Featured Projects</text>
</svg>
